{% extends "base.html" %}
{% block title %}统计分析{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h4 class="mb-0">统计分析</h4>
  <div class="d-flex gap-2 align-items-center">
    <input type="month" id="month-picker" class="form-control" value="{{ month }}" style="width:170px">
    <button class="btn btn-outline-primary" id="btn-budget" type="button">设置预算</button>
  </div>
</div>

<div id="budget-banner" class="budget-banner mb-3 d-none"></div>

<div class="row g-3 mb-3">
  <div class="col-md-3">
    <div class="card metric-card p-3">
      <div class="metric-label">收入</div>
      <div class="metric-value text-income" id="m-income">¥0.00</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card metric-card p-3">
      <div class="metric-label">支出</div>
      <div class="metric-value text-expense" id="m-expense">¥0.00</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card metric-card p-3">
      <div class="metric-label">结余</div>
      <div class="metric-value" id="m-balance">¥0.00</div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card metric-card p-3">
      <div class="metric-label">预算使用</div>
      <div class="metric-value" id="m-budget">未设置</div>
    </div>
  </div>
</div>

<div class="row g-3">
  <div class="col-lg-6">
    <div class="card p-3">
      <h6 class="mb-2">支出分类占比</h6>
      <div id="chart-pie" class="chart-box"></div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card p-3">
      <h6 class="mb-2">近 6 个月收支对比</h6>
      <div id="chart-bar" class="chart-box"></div>
    </div>
  </div>
  <div class="col-12">
    <div class="card p-3">
      <h6 class="mb-2">本月每日支出</h6>
      <div id="chart-line" class="chart-box"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/echarts.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/stats.js') }}"></script>
{% endblock %}
