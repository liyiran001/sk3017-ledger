{% extends "base.html" %}
{% block title %}{{ '编辑记录' if record else '记一笔' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="mb-3">{{ '编辑记录' if record else '记一笔' }}</h4>
      <form method="post" novalidate>
        <div class="mb-3">
          <label class="form-label" for="category_id">分类</label>
          <select class="form-select" id="category_id" name="category_id" required>
            <option value="">请选择分类</option>
            <optgroup label="支出">
              {% for c in categories if c.type == 'expense' %}
              <option value="{{ c.id }}" {{ 'selected' if record and record.category_id == c.id }}>{{ c.name }}</option>
              {% endfor %}
            </optgroup>
            <optgroup label="收入">
              {% for c in categories if c.type == 'income' %}
              <option value="{{ c.id }}" {{ 'selected' if record and record.category_id == c.id }}>{{ c.name }}</option>
              {% endfor %}
            </optgroup>
          </select>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="amount">金额（元）</label>
            <input class="form-control" id="amount" name="amount" type="number" step="0.01" min="0"
                   required value="{{ '%.2f' | format(record.amount) if record else '' }}">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="record_date">日期</label>
            <input class="form-control" id="record_date" name="record_date" type="date" required
                   value="{{ record.record_date if record else today }}">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="remark">备注</label>
          <input class="form-control" id="remark" name="remark" maxlength="255"
                 value="{{ record.remark if record else '' }}">
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">保存</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('records.index') }}">取消</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
