{% extends "base.html" %}
{% block title %}注册{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4 mt-4">
      <h4 class="mb-3">注册</h4>
      <form method="post" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">用户名</label>
          <input class="form-control" id="username" name="username" required autofocus
                 value="{{ request.form.get('username', '') }}">
          <div class="form-text">3~20 位，可用字母、数字、下划线或中文</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="nickname">昵称（选填）</label>
          <input class="form-control" id="nickname" name="nickname"
                 value="{{ request.form.get('nickname', '') }}">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">密码</label>
          <input class="form-control" id="password" name="password" type="password" required>
          <div class="form-text">至少 6 位</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm">确认密码</label>
          <input class="form-control" id="confirm" name="confirm" type="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">注册</button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0">
        已有账号？<a href="{{ url_for('auth.login') }}">去登录</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
