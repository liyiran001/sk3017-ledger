{% extends "base.html" %}
{% block title %}首页{% endblock %}

{% block content %}
<div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
  <h1 class="display-6 fw-bold">记好每一笔，看清每月钱去哪了</h1>
  <p class="lead text-muted mt-3">
    个人记账本支持收支记录、组合筛选、三张图表统计与月度预算提醒。数据保存在本地 MySQL，图表由服务端聚合后渲染。
  </p>
  <div class="mt-4">
    <a class="btn btn-primary btn-lg me-2" href="{{ url_for('auth.register') }}">免费注册</a>
    <a class="btn btn-outline-secondary btn-lg" href="{{ url_for('auth.login') }}">已有账号，登录</a>
  </div>
</div>

<div class="row g-4">
  <div class="col-md-4">
    <div class="card h-100 p-4">
      <h5>📝 快速记账</h5>
      <p class="text-muted mb-0">金额、分类、日期、备注，三秒记一笔；支持编辑与删除。</p>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card h-100 p-4">
      <h5>🔍 组合筛选</h5>
      <p class="text-muted mb-0">按月份、分类、收支类型任意组合筛选，统计随筛选实时联动。</p>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card h-100 p-4">
      <h5>📊 图表统计</h5>
      <p class="text-muted mb-0">分类占比饼图、近半年收支对比、每日支出趋势，一眼看清消费结构。</p>
    </div>
  </div>
</div>
{% endblock %}
